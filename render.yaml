services:
  - type: web
    name: bernas-agent
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GEMINI_API_KEY
        sync: false
      - key: SOLANA_PRIVATE_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ALERT_CONTACTS
        sync: false
    healthCheckPath: /api/v1/health